<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LOLCODE Workbench</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <a class="brand" href="/" aria-label="LOLCODE Workbench home"><b>:3</b> LOLCODE <span class="muted">workbench</span></a>
    <div class="controls">
      <label class="visually-hidden" for="example">Example program</label>
      <select id="example">
        <option value="hello">Hello, world</option>
        <option value="math">Variables &amp; math</option>
        <option value="conditional">Conditional</option>
        <option value="input">Input (GIMMEH)</option>
      </select>
      <button id="load" class="quiet">Load</button>
      <button id="open" class="quiet">Open</button>
      <input type="file" id="file" accept=".lol,.txt" hidden>
      <button id="download" class="quiet">Save</button>
    </div>
  </header>
  <main>
    <section class="panel editor-panel" aria-label="Code editor">
      <div class="panel-head">
        <span class="file">playground.lol</span>
        <div class="actions">
          <button id="tokenize">Tokenize</button>
          <button id="analyze">Analyze</button>
          <button id="run" class="primary">Run &#9654;</button>
        </div>
      </div>
      <div class="editor-wrap">
        <pre id="lines" aria-hidden="true">1</pre>
        <textarea id="source" aria-label="LOLCODE source code" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off"></textarea>
      </div>
      <details class="stdin">
        <summary>Input for GIMMEH <span class="muted">(one value per line)</span></summary>
        <textarea id="stdin" aria-label="Values for GIMMEH, one per line" spellcheck="false" rows="3"></textarea>
      </details>
      <div class="panel-foot"><span id="position">Ln 1, Col 1</span><span>Ctrl/&#8984;+Enter runs &middot; Esc then Tab leaves the editor</span></div>
    </section>
    <section class="panel results-panel" aria-label="Results">
      <div class="panel-head">
        <div class="tabs" role="tablist" aria-label="Results">
          <button id="output-tab" role="tab" aria-selected="true" aria-controls="output-panel" tabindex="0">Output</button>
          <button id="tokens-tab" role="tab" aria-selected="false" aria-controls="tokens-panel" tabindex="-1">Tokens <span id="token-count">0</span></button>
          <button id="tree-tab" role="tab" aria-selected="false" aria-controls="tree-panel" tabindex="-1">Syntax tree</button>
          <button id="symbols-tab" role="tab" aria-selected="false" aria-controls="symbols-panel" tabindex="-1">Symbols</button>
        </div>
        <button id="clear" class="quiet">Clear</button>
      </div>
      <div id="output-panel" role="tabpanel" aria-labelledby="output-tab" class="result-content"></div>
      <div id="tokens-panel" role="tabpanel" aria-labelledby="tokens-tab" class="result-content" hidden></div>
      <div id="tree-panel" role="tabpanel" aria-labelledby="tree-tab" class="result-content" hidden></div>
      <div id="symbols-panel" role="tabpanel" aria-labelledby="symbols-tab" class="result-content" hidden></div>
    </section>
  </main>
  <footer id="status" class="status" role="status" aria-live="polite"><b id="status-label">READY</b><span id="status-message">Write or load a program, then Tokenize, Analyze, or Run.</span></footer>
</body>
</html>
